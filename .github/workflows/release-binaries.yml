name: Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          out="gog"
          if [ "$GOOS" = "windows" ]; then out="gog.exe"; fi
          go build -ldflags="-s -w" -o "$out" .

          archive="gog_${{ github.event.release.tag_name }}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            zip "${archive}.zip" "$out"
            echo "ASSET=${archive}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${archive}.tar.gz" "$out"
            echo "ASSET=${archive}.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload release asset
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.ASSET }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
